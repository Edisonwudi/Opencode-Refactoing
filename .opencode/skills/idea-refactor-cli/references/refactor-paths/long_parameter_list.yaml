long_parameter_list:
  - id: static-util-7-params-to-request-object
    when: "a static utility signature is long because all parameters travel together as one request, and the old multi-arg entrypoint can be removed outright"
    before: |
      255    public static String random(int count, int start, int end, final boolean letters,
      256            final boolean numbers, final char[] chars, final Random random) {
      257        if (count == 0) {
      258            return StringUtils.EMPTY;
      259        }
      260        if (count < 0) {
      261            throw new IllegalArgumentException("Requested random string length " + count + " is less than 0.");
      262        }
      263        // ... guards, ASCII optimizations, and loop body omitted ...
      397    }
    actions:
      - op: introduce:parameter-object
        apply_args: '{"className":"RandomRequest","packageName":"org.apache.commons.lang3","parameterNames":["count","start","end","letters","numbers","chars","random"],"keepMethodAsDelegate":false}'
        cli_steps:
          - idea_refactor_preview(operation="introduce:parameter-object", file="src/main/java/org/apache/commons/lang3/RandomStringUtils.java", line=255, column=25, arguments={"className":"RandomRequest","packageName":"org.apache.commons.lang3","parameterNames":["count","start","end","letters","numbers","chars","random"],"keepMethodAsDelegate":false})

          - idea_refactor_apply(proposalId="<preview.proposalId>", arguments={"className":"RandomRequest","packageName":"org.apache.commons.lang3","parameterNames":["count","start","end","letters","numbers","chars","random"],"keepMethodAsDelegate":false})
    after: |
      // Old 7-param signature is GONE — replaced entirely by:
      247    public static String random(RandomRequest randomRequest) {
      248        if (randomRequest.getCount() == 0) {
      249            return StringUtils.EMPTY;
      250        }
      251        // ... original body, now reading from randomRequest.getXxx() ...
      397    }
      // New file RandomRequest.java created (7 fields + constructor + getters)
      // All call sites rewritten:
      //   test: random(new RandomRequest(count, start, end, letters, numbers, chars, random))
    source: { project: commons-lang-3.20.0, class: RandomStringUtils, verified: "2026-05-10" }
