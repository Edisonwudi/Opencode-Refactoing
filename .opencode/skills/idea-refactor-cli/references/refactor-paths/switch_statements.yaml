      10     private static final byte[] CHAR_CLASSES = createCharClasses();
      12     private static byte[] createCharClasses() {
      13         byte[] classes = new byte[128];
      14         classes['"'] = CLASS_QUOTE;
      15         classes[','] = CLASS_SEPARATOR;
      16         classes[';'] = CLASS_SEPARATOR;
      17         classes['\n'] = CLASS_LINE_BREAK;
      18         classes['\r'] = CLASS_LINE_BREAK;
      19         return classes;
      20     }
      70     Token readToken(CharStream stream) {
      71         char ch = stream.peek();
      72         byte charClass = ch < CHAR_CLASSES.length ? CHAR_CLASSES[ch] : CLASS_WORD;
      73         if (charClass == CLASS_QUOTE) {
      74             return readQuoted(stream);
      75         }
      76         if (charClass == CLASS_SEPARATOR) {
      77             stream.skip();
      78             return Token.separator(ch);
      79         }
      80         if (charClass == CLASS_LINE_BREAK) {
      81             return readLineBreak(stream);
      82         }
      83         return readBareWord(stream);
      84     }
    source: { project: synthetic-refactor-paths, class: TokenReader, verified: synthetic }
    notes:
      - "Use this path for parser/tokenizer character classification; preserve fall-through groups by assigning the same class value to every equivalent character."
      - "Do not use this path when branch bodies mutate parser state in incompatible order; first prove escape, EOF, default, and line-ending behavior are unchanged."
      - "For Unicode-heavy parsers, prefer a helper method over a fixed ASCII array unless the original switch was already ASCII-only."
