# IDEA refactor path examples.
# Smell: feature_envy
# Loaded on demand by idea-refactor-cli; do not load unrelated smell files.
# Entry ids:
# - move-static-util-to-correct-owner
# - move-instance-method-to-storage-owner
# - extract-slice-then-move-to-envied-receiver
# - receiver-side-helper-replace-source-delegation

feature_envy:
  - id: move-static-util-to-correct-owner
    when: "a static helper uses no source state and mostly manipulates another type's data, so the whole method should move to that owner type"
    before: |
      153    static int indexOfEqual(final String token) {
      154        return token.indexOf(Char.EQUAL);
      155    }
      // Lives in DefaultParser, but only uses String + Char — belongs in Util
      // Called from DefaultParser, GnuParser, PosixParser (5 call sites total)
    actions:
      - op: move:method
        apply_args: '{"targetClassFqcn":"org.apache.commons.cli.Util"}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/cli/DefaultParser.java", line=153, column=17)
          - inspect source context for nav:call-hierarchy before choosing the native refactor target
          - inspect source context for nav:workspace-symbol before choosing the native refactor target
          - idea_refactor_prepare(operation="move:method", expectedOperation="move:method")
          - idea_refactor_apply(arguments={"targetClassFqcn":"org.apache.commons.cli.Util"})
    after: |
      // DefaultParser.java — indexOfEqual removed
      365        if (Util.indexOfEqual(token) == -1) {
      472        final int pos = Util.indexOfEqual(token);
      // ... all 5 call sites updated automatically
      // Util.java — method added
      90    static int indexOfEqual(final String token) {
      91        return token.indexOf(Char.EQUAL);
      92    }
    source: { project: commons-cli-1.9.0, class: DefaultParser → Util, verified: "2026-05-09" }
  - id: move-instance-method-to-storage-owner
    when: "an instance method in a coordinator class mostly enforces one collaborator's policy and storage rules, so the whole method can move intact"
    before: |
      /* KeyPairCleanupService.java */
      62                        keyPersistenceService.removeKey(key.getKeyId());
      63                        removePrivateKey(key.getKeyId());
      ...
      74    private void removePrivateKey(String keyId) throws IOException {
      75        if (!keyPersistenceService.isKeystoreEnabled()) {
      76            return;
      77        }
      78
      79        Path privateKeyDirectory = Paths.get(InstallationPathConfig.getPrivateKeyPath());
      80        Path keyFile = privateKeyDirectory.resolve(keyId + KeyPersistenceService.KEY_SUFFIX);
      81
      82        if (Files.exists(keyFile)) {
      83            Files.delete(keyFile);
      84            log.debug("Deleted private key: {}", keyFile);
      85        }
      86    }
    actions:
      - op: move:method
        apply_args: '{"targetVariableName":"keyPersistenceService","newName":"removePrivateKey"}'
        cli_steps:
          - idea_refactor_locate(file="app/proprietary/src/main/java/stirling/software/proprietary/security/service/KeyPairCleanupService.java", line=74, column=18)
          - inspect source context for nav:call-hierarchy before choosing the native refactor target
          - idea_refactor_locate(file="app/proprietary/src/main/java/stirling/software/proprietary/security/service/KeyPairCleanupService.java", line=75, column=14)
          - inspect source context for nav:hover before choosing the native refactor target
          - idea_refactor_locate(file="app/proprietary/src/main/java/stirling/software/proprietary/security/service/KeyPairCleanupService.java", line=74, column=18)
          - idea_refactor_prepare(operation="move:method", arguments={"targetVariableName":"keyPersistenceService","newName":"removePrivateKey"}, expectedOperation="move:method")
          - idea_refactor_apply(arguments={"targetVariableName":"keyPersistenceService","newName":"removePrivateKey"})
          - idea_refactor_apply(arguments={"targetVariableName":"keyPersistenceService","newName":"removePrivateKey"}, decisions={"move:method.conflict.de1a7bd7ba9a635d":"refactor_anyway"})
    after: |
      /* KeyPairCleanupService.java */
      62                        keyPersistenceService.removeKey(key.getKeyId());
      63                        keyPersistenceService.removePrivateKey(key.getKeyId());
      // CLI prepare exposed the conflict, the first apply round stayed at needs_decision,
      // and the second apply round with refactor_anyway moved the method successfully.

      /* KeyPersistenceService.java */
      244    void removePrivateKey(String keyId) throws IOException {
      245        if (!isKeystoreEnabled()) {
      246            return;
      247        }
      248
      249        Path privateKeyDirectory = Paths.get(InstallationPathConfig.getPrivateKeyPath());
      250        Path keyFile = privateKeyDirectory.resolve(keyId + KEY_SUFFIX);
      251
      252        if (Files.exists(keyFile)) {
      253            Files.delete(keyFile);
      254            log.debug("Deleted private key: {}", keyFile);
      255        }
      256    }
    source: { project: Stirling-PDF-v2.1.5, class: KeyPairCleanupService -> KeyPersistenceService, verified: "2026-05-11", mode: "OpenCode IDEA tools" }
    notes: "Verified with idea_refactor_locate/idea_refactor_prepare/idea_refactor_apply against an attached IDEA service. prepare surfaced a private-field accessibility conflict; the first apply round remained at needs_decision, and the second apply round succeeded only after idea_refactor_apply(decisions={\"move:method.conflict.de1a7bd7ba9a635d\":\"refactor_anyway\"}). The resulting temporary project still compiled with ./gradlew :proprietary:compileJava. This exact method pair is not one of the dataset's recorded feature_envy cases."
  - id: extract-slice-then-move-to-envied-receiver
    when: "a receiver-heavy slice inside a larger source method must move to the envied receiver; extract:method is only a temporary isolation step, and the plan must not stop after extract:method or leave the helper in the original source class"
    before: |
      /* Source.java */
      3     class Receiver {
      4         void accept(String value) {
      5         }
      6     }
      8     class Source {
      9         private String secret = "token";
      11        void process(Receiver receiver) {
      12            int count = 1;
      13            receiver.accept(secret);
      14            System.out.println(count);
      15        }
      16    }
    actions:
      - op: extract:method
        apply_args: '{"newName":"sendSecret","visibility":"private","makeStatic":false,"replaceDuplicates":false}'
        cli_steps:
          - idea_refactor_locate(file="src/demo/Source.java", line=13, column=9, suggestSelectionsFor="extract:method", expectedOperation="extract:method")
          - idea_refactor_locate(file="src/demo/Source.java", line=13, column=9, selection={"startLine":13,"startColumn":9,"endLine":13,"endColumn":33})
          - idea_refactor_prepare(operation="extract:method", expectedOperation="extract:method")
          - idea_refactor_apply(arguments={"newName":"sendSecret","visibility":"private","makeStatic":false,"replaceDuplicates":false})
      - op: move:method
        apply_args: '{"targetVariableName":"receiver","newName":"sendSecret"}'
        cli_steps:
          - idea_refactor_locate(file="src/demo/Source.java", line=17, column=18)
          - idea_refactor_prepare(operation="move:method", arguments={"targetVariableName":"receiver","newName":"sendSecret"}, expectedOperation="move:method")
          - idea_refactor_apply(arguments={"targetVariableName":"receiver","newName":"sendSecret"}, decisions={"move:method.visibility.938852b473beaaab":"escalate_visibility"})
    after: |
      /* Source.java */
      3     class Receiver {
      4         void accept(String value) {
      5         }
      7         void sendSecret(Source source) {
      8             accept(source.secret);
      9         }
      10    }
      12    class Source {
      13        String secret = "token";
      15        void process(Receiver receiver) {
      16            int count = 1;
      17            receiver.sendSecret(this);
      18            System.out.println(count);
      19        }
      20    }
    source: { project: minimal-live-smoke, class: Source -> Receiver, verified: "2026-05-17", mode: "real IDEA CLI + javac" }
    notes:
      - "The second locate carries the selected statement, so extract:method does not consume a selection.patch decision."
      - "move:method prepare returned a visibility.patch decision because the moved method would access Source.secret from Receiver. Consuming escalate_visibility made secret package-visible, moved the method, and javac passed."
      - "The decision id shown is the stable id from this smoke; in a new project, use the exact move:method.visibility.* id returned by prepare."
      - "This path is invalid unless the extracted behavior finishes on the envied receiver through move:method or an equivalent receiver-side recreation."
      - "A helper that remains in the original source class is only an incomplete prefix, not a valid feature_envy final state."
  - id: receiver-side-helper-replace-source-delegation
    when: "the source method must stay as an entrypoint or coordinator, but a receiver-heavy computation can be expressed as a new helper on the envied receiver and the source can delegate to it"
    before: |
      /* OrderWorkflow.java */
      21    Receipt previewReceipt(CustomerAccount account, Cart cart) {
      22        BigDecimal subtotal = account.priceBook().price(cart.items());
      23        BigDecimal discount = account.discountPolicy().apply(subtotal, account.tier());
      24        BigDecimal tax = account.region().taxRules().tax(subtotal.subtract(discount));
      25        return new Receipt(subtotal, discount, tax);
      26    }

      /* CustomerAccount.java */
      10    class CustomerAccount {
      11        PriceBook priceBook() { ... }
      12        DiscountPolicy discountPolicy() { ... }
      13        Region region() { ... }
      14        Tier tier() { ... }
      15    }
    actions:
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/sales/CustomerAccount.java, choose a unique surrounding oldString at the insertion point, and call idea_edit with newString equal to that old block plus the inserted Java source; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/sales/CustomerAccount.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/sales/OrderWorkflow.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/sales/OrderWorkflow.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      /* OrderWorkflow.java */
      21    Receipt previewReceipt(CustomerAccount account, Cart cart) {
      22        return account.previewReceipt(cart);
      23    }

      /* CustomerAccount.java */
      16    Receipt previewReceipt(Cart cart) {
      17        BigDecimal subtotal = priceBook().price(cart.items());
      18        BigDecimal discount = discountPolicy().apply(subtotal, tier());
      19        BigDecimal tax = region().taxRules().tax(subtotal.subtract(discount));
      20        return new Receipt(subtotal, discount, tax);
      21    }
    source: { project: synthetic-refactor-paths, class: OrderWorkflow / CustomerAccount, verified: "synthetic" }
    notes:
      - "Use this path when the original method should remain as a public/framework/coordinator entrypoint but its receiver-heavy internals belong on the receiver."
      - "Do not move the whole source method if doing so would drag coordinator-only dependencies into the receiver; create a receiver-side helper and replace the source body with a narrow delegation."
