    source: { project: synthetic-refactor-paths, class: PanelController state cluster -> PanelState, verified: "native extract:class capability checked in IDEA CLI 2026-06-08" }
    notes:
      - "Use native `extract:class` first when IDEA exposes it on the reported class and can migrate the selected fields plus maintaining methods."
      - "The selected `memberNames` must include the cohesive field cluster and the methods that maintain it; method-only extraction is not enough for field-heavy god classes."
      - "Private wrappers left after extraction must be removed with idea_edit old/new patches; keeping a full forwarding family preserves NOM and should still fail the guard."
      - "Public or framework entrypoints may remain only as narrow entrypoints. A wrapper for every moved method is not a valid final state."
