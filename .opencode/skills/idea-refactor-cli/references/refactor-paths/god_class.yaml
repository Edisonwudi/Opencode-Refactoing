        notes:
          - "Private wrappers left after extraction must be removed with `idea_edit`; skip only if native extraction already removed the wrapper declaration."
      - op: idea_edit
        argument_contract: "Read src/main/java/demo/PanelController.java, choose the exact unique oldString for the declaration/block being removed, and call idea_edit with newString=\"\"; replaceAll=false."
