# IDEA refactor path examples.
# Smell: god_class
# Loaded on demand by idea-refactor-cli; do not load unrelated smell files.
# Entry ids:
# - extract-class-state-and-behavior
# - move-method-cluster-to-owner
# - insert-type-state-cluster-member-migration

god_class:
  - id: extract-class-state-and-behavior
    when: "primary route when the reported class has a cohesive field/state cluster such as cache, font, text, image, or geometry state, and the cluster's maintaining behavior can move with that state"
    before: |
      /* PanelController.java */
      3     class PanelController {
      4       private int left = 0;
      5       private int top = 0;
      6       private int width = 10;
      7       private int height = 10;
      8       private int scroll = 0;
      9       private int focusIndex = 0;
      10      private int selectedIndex = -1;
      11      private boolean dirty = false;
      12      private final ThemeMetrics metrics = new ThemeMetrics();
      13      private final AuditLog audit = new AuditLog();
      14
      15      void layout(ScreenModel model) { resize(model); scrollTo(model, 0); focus(model, selectedIndex); }
      16      private void resize(ScreenModel model) { width = metrics.width(model); height = metrics.height(model); dirty = true; }
      17      private void scrollTo(ScreenModel model, int value) { scroll = Math.max(0, value); top = metrics.top(model) - scroll; dirty = true; }
      18      private void focus(ScreenModel model, int index) { focusIndex = Math.max(0, index); selectedIndex = focusIndex; dirty = true; }
      19      private void clear(ScreenModel model) { focusIndex = 0; selectedIndex = -1; scroll = 0; dirty = true; }
      20      void render(ScreenModel model) { if (dirty) { audit.record(model.name()); } metrics.paint(model, left, top, width, height); }
      21      String status(ScreenModel model) { return model.name() + ":" + left + ":" + top + ":" + width + ":" + height; }
      22    }
    actions:
      - op: extract:class
        apply_args: '{"className":"PanelState","memberNames":["left","top","width","height","scroll","focusIndex","selectedIndex","dirty","metrics","audit","resize","scrollTo","focus","clear"]}'
        cli_steps:
          - idea_refactor_preview(operation="extract:class", file="src/main/java/demo/PanelController.java", line=3, column=7, arguments={"className":"PanelState","memberNames":["left","top","width","height","scroll","focusIndex","selectedIndex","dirty","metrics","audit","resize","scrollTo","focus","clear"]})

          - idea_refactor_apply(proposalId="<preview.proposalId>", arguments={"className":"PanelState","memberNames":["left","top","width","height","scroll","focusIndex","selectedIndex","dirty","metrics","audit","resize","scrollTo","focus","clear"]})
      - op: idea_edit
        argument_contract: "Read src/main/java/demo/PanelController.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
