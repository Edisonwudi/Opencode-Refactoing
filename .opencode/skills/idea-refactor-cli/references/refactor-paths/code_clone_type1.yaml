# IDEA refactor path examples.
# Smell: code_clone_type1
# Loaded on demand by idea-refactor-cli; do not load unrelated smell files.
# Entry ids:
# - same-file-exact-clone
# - shared-parent-pull-up-clone
# - different-parent-shared-helper-clone
# - existing-owner-delegation-clone
# - type-variant-shared-core-clone

code_clone_type1:
  - id: same-file-exact-clone
    when: "the clones are exact whole methods in the same file, so one extraction with duplicate replacement can collapse both at once"
    before: |
      1301        private boolean anythingElse(Token t, HtmlTreeBuilder tb) {
      1302            return tb.process(t, InTable);
      1303        }

      1374        private boolean anythingElse(Token t, HtmlTreeBuilder tb) {
      1375            return tb.process(t, InTable);
      1376        }
    actions:
      - op: extract:method
        apply_args: '{"newName":"processAsInTable","visibility":"private","replaceDuplicates":true}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/jsoup/parser/HtmlTreeBuilderState.java", line=1301, column=17, suggestSelectionsFor="extract:method", expectedOperation="extract:method")
          - idea_refactor_locate(file="src/main/java/org/jsoup/parser/HtmlTreeBuilderState.java", line=1301, column=17, selection={"startLine":1302,"startColumn":13,"endLine":1302,"endColumn":43})
          - idea_refactor_prepare(operation="extract:method", expectedOperation="extract:method")
          - idea_refactor_apply(arguments={"newName":"processAsInTable","visibility":"private","replaceDuplicates":true})
    after: |
      1301        private boolean anythingElse(Token t, HtmlTreeBuilder tb) {
      1302            return processAsInTable(t, tb);
      1303        }

      1374        private boolean anythingElse(Token t, HtmlTreeBuilder tb) {
      1375            return processAsInTable(t, tb);
      1376        }

      1380        private boolean processAsInTable(Token t, HtmlTreeBuilder tb) {
      1381            return tb.process(t, InTable);
      1382        }
    source: { project: jsoup-1.18.1, class: HtmlTreeBuilderState, verified: "2026-05-09" }
    notes: "Use idea_refactor_locate(..., suggestSelectionsFor=\"extract:method\") only to inspect candidate ranges. Then run a fresh locate with the selected range before prepare; because the draft already contains the selection, prepare/apply should not consume a selection.patch decision."
  - id: shared-parent-pull-up-clone
    when: "the clones are identical sibling overrides under a real shared parent, so the right normalization is pull-up rather than a new helper"
    before: |
      165        boolean isNumber() {
      166            return false;
      167        }

      349        boolean isNumber() {
      350            return false;
      351        }
    actions:
      - op: pullUp:method
        apply_args: '{"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/lang3/time/FastDateParser.java", line=165, column=9)
          - idea_refactor_prepare(operation="pullUp:method", arguments={"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"}, expectedOperation="pullUp:method")
          - idea_refactor_apply(arguments={"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"})
          - idea_refactor_apply(arguments={"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"}, decisions={"pullUp.duplicate.org.apache.commons.lang3.time.FastDateParser.Strategy.isNumber":"remove_source_duplicate"})
    after: |
      165        // isNumber() now inherited from Strategy's default false implementation.
      166        // The JSON decision flow allowed the pull-up to proceed without an IDEA modal.

      349        // PatternStrategy also inherits Strategy's default false implementation.
      350        // The duplicate override is removed after selecting remove_source_duplicate.

      160    private abstract static class Strategy {
      161        boolean isNumber() {
      162            return false;
      163        }
      164    }
    source: { project: commons-lang-3.20.0, class: FastDateParser, verified: "2026-05-09" }
    notes:
      - "After pull-up, remove every child duplicate and shadowing duplicate state. Compile-check constructors and final-field assignment before verification."
      - "A parent implementation plus one leftover child copy is still a clone and must not be accepted."
