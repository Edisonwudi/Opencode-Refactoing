    notes:
      - "Use this path when source inspection proves an existing owner already provides the duplicated behavior. Do not create a second helper just to satisfy the clone smell."
      - "Dependency injection, constructors, and test fixtures may need narrow direct_edit follow-up because IDEA structural insertion does not know framework wiring."
      - "Do not add nullable injection and retain the original clone as a fallback. Establish one reliable owner route and remove the superseded body."
      - "Use the project's established wiring pattern and update affected construction sites or fixtures."
      - "Do not widen a private or protected method to public solely to make delegation convenient; preserve the public API and use the narrowest valid owner/helper visibility."
  - id: type-variant-shared-core-clone
