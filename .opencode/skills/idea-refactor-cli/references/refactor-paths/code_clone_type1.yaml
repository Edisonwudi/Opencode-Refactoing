    notes:
      - "Use this path for overload families where the public signatures are part of the API and should remain stable."
      - "Do not replace primitive overloads with a broad Object/generic API or a helper that makes call sites uglier; keep type-specific wrappers and share only the loop/control core."
      - "For primitive variants, use an index predicate/comparator or typed adapter that compiles for every overload; do not force boolean, short, or other primitives through an incompatible generic functional interface."
      - "Do not create two overloaded helpers with identical algorithm bodies. There must be one type-neutral core; use Object/reflection, an indexed predicate, a comparator, or another existing type-neutral abstraction when necessary."
      - "Overload and override dispatch is behavior. If the original loop calls primitive overloads or overridable hooks, keep that typed call in each wrapper and share iteration through an IntConsumer/index callback. Do not feed boxed Array.get(...) results to an Object overload."
      - "Keep the first cohesive edit to the two reported overloads. Broaden the family only when compilation or the structural Oracle proves the pair cannot be centralized independently."
      - "After Oracle feedback, inspect the complete production diff and remove superseded wrappers, duplicate adapters, and unused imports before final verification."
