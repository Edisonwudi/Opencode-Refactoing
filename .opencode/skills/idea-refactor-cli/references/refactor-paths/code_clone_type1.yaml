  - id: shared-parent-pull-up-clone
    when: "the clones are identical sibling overrides under a real shared parent, so the right normalization is pull-up rather than a new helper"
    before: |
      165        boolean isNumber() {
      166            return false;
      167        }

      349        boolean isNumber() {
      350            return false;
      351        }
    actions:
      - op: pullUp:method
        apply_args: '{"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/lang3/time/FastDateParser.java", line=165, column=9)
          - idea_refactor_prepare(operation="pullUp:method", arguments={"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"}, expectedOperation="pullUp:method")
          - idea_refactor_apply(arguments={"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"})
          - idea_refactor_apply(arguments={"targetSuperFqcn":"org.apache.commons.lang3.time.FastDateParser.Strategy"}, decisions={"pullUp.duplicate.org.apache.commons.lang3.time.FastDateParser.Strategy.isNumber":"remove_source_duplicate"})
    after: |
      165        // isNumber() now inherited from Strategy's default false implementation.
      166        // The JSON decision flow allowed the pull-up to proceed without an IDEA modal.

      349        // PatternStrategy also inherits Strategy's default false implementation.
      350        // The duplicate override is removed after selecting remove_source_duplicate.

      160    private abstract static class Strategy {
      161        boolean isNumber() {
      162            return false;
      163        }
      164    }
    source: { project: commons-lang-3.20.0, class: FastDateParser, verified: "2026-05-09" }
    notes:
      - "After pull-up, remove every child duplicate and shadowing duplicate state. Compile-check constructors and final-field assignment before verification."
      - "A parent implementation plus one leftover child copy is still a clone and must not be accepted."
      - "Trace intermediate superclasses before deciding there is no shared parent; one target may inherit the common owner through an unchanged middle class."
      - "For duplicated constructor initialization, move shared state initialization to the real parent constructor and make both child constructors delegate with super(...)."
      - "Before moving behavior or fields, inspect every direct and transitive non-target child. Do not pull up state when that changes unrelated descendants, reflection or serialization shape, framework wiring, or lifecycle side-effect order."
      - "When child-owned fields or ordering must remain local, keep both overrides and fields in place, add one protected parameterized helper to the parent, call it at the original point in each override, and preserve the surrounding super-call order."
      - "If both children already declare same-named resource fields, do not remove or relocate those declarations. Select child-owned-lifecycle-helper-clone instead of completing a field pull-up."
      - "Identity-bearing child sentinels and locks are child-owned state too. If code uses ==, keep each original object declaration and pass it into a shared helper; moving it to the parent changes identity semantics."
  - id: child-owned-lifecycle-helper-clone
    when: "sibling lifecycle methods duplicate resource cleanup or setup, but each child owns the fields and must retain declaration shape and super-call order"
    before: |
      /* FirstChild.java */
      protected Connection connection;
      protected Cache cache;
      public void stop() {
          if (connection != null) {
              connection.disconnect();
          }
          if (cache != null) {
              cache.clear();
          }
          super.stop();
      }

      /* SecondChild.java declares the same field names and cleanup sequence. */
    actions:
      - op: idea_edit
        argument_contract: "Add one protected parameterized lifecycle helper to the closest shared parent. The helper receives the child-owned resources; it must not introduce or move resource fields."
        cli_steps:
          - idea_edit(file="<shared-parent.java>", oldString=<unique exact insertion block>, newString=<same block plus one protected helper accepting the resources>, replaceAll=false)
      - op: idea_edit
        argument_contract: "In each target child, preserve the field declarations and the surrounding lifecycle method. Replace only the duplicated block with a call to the shared helper at the same position."
        cli_steps:
          - idea_edit(file="<first-child.java>", oldString=<exact duplicated block>, newString=<shared helper call>, replaceAll=false)
          - idea_edit(file="<second-child.java>", oldString=<exact duplicated block>, newString=<shared helper call>, replaceAll=false)
    after: |
      /* SharedParent.java */
      protected final void cleanupResources(Connection connection, Cache cache) {
          if (connection != null) {
              connection.disconnect();
          }
          if (cache != null) {
              cache.clear();
          }
      }

      /* FirstChild.java */
      protected Connection connection; // declaration remains in this child
      protected Cache cache;            // declaration remains in this child
      public void stop() {
          cleanupResources(connection, cache);
          super.stop();                 // original order is preserved
      }

      /* SecondChild.java uses the same helper and retains its own fields. */
    source: { project: synthetic-refactor-paths, class: SharedParent / FirstChild / SecondChild, verified: "synthetic" }
    notes:
      - "Choose this route before shared-parent-pull-up-clone when child-declared state, reflection, serialization, framework wiring, or lifecycle order is observable."
      - "A no-progress result means the original blocks were not replaced. Do not respond by moving the child fields; replace each duplicated block with the shared call."
      - "Keep logging, exception handling, and the position of super.stop() equivalent to the original methods."
  - id: child-owned-identity-sentinel-helper-clone
    when: "two methods duplicate an identity-sentinel unwrap/check, and each original owner declares its own sentinel instance"
    before: |
      /* FirstChild.java */
      private final Position nullPosition = new Position() {};
      public Position getPosition(Key key) {
          Position value = super.getPosition(key);
          if (value == nullPosition) {
              return null;
          }
          return value;
      }

      /* SecondChild.java has its own nullPosition instance and the same unwrap. */
    actions:
      - op: idea_edit
        argument_contract: "Add exactly one helper to a shared parent or package owner. It must accept both the retrieved value and the caller's existing sentinel, compare them with ==, and must not declare a sentinel field."
        cli_steps:
          - idea_edit(file="<shared-parent-or-helper.java>", oldString=<unique exact insertion block>, newString=<same block plus unwrapSentinel(value, ownerSentinel)>, replaceAll=false)
      - op: idea_edit
        argument_contract: "Keep each sentinel field in its original child. Replace only the multi-line unwrap block with unwrapSentinel(super.getPosition(key), nullPosition)."
        cli_steps:
          - idea_edit(file="<first-child.java>", oldString=<exact unwrap block>, newString=<shared helper call>, replaceAll=false)
          - idea_edit(file="<second-child.java>", oldString=<exact unwrap block>, newString=<shared helper call>, replaceAll=false)
    after: |
      /* Shared parent or helper */
      protected static <T> T unwrapSentinel(T value, T ownerSentinel) {
          return value == ownerSentinel ? null : value;
      }

      /* FirstChild.java */
      private final Position nullPosition = new Position() {}; // remains here
      public Position getPosition(Key key) {
          return unwrapSentinel(super.getPosition(key), nullPosition);
      }

      /* SecondChild.java keeps its distinct sentinel and uses the same helper. */
    source: { project: synthetic-refactor-paths, class: Parent / FirstChild / SecondChild, verified: "synthetic" }
    notes:
      - "This is the default route when identity is observed with == or tests/reflection expect the sentinel to remain declared in each child."
      - "Do not add a parent sentinel, shared singleton sentinel, or virtual sentinel accessor. Pass the original child-owned object explicitly."
      - "The short wrappers are valid shared-callee delegates and preserve each owner's identity semantics."
