    after: |
      /* IndexSearch.java */
      25    private static int lastMatchingIndex(final int length, final IntPredicate matches, int start) {
      26        for (int i = Math.min(start, length - 1); i >= 0; i--) {
      27            if (matches.test(i)) {
      28                return i;
      29            }
      30        }
      31        return -1;
      32    }

      34    static int lastIndexOf(int[] values, int target, int start) {
      35        return lastMatchingIndex(values.length, i -> values[i] == target, start);
      36    }

      38    static int lastIndexOf(long[] values, long target, int start) {
