    source: { project: commons-lang-3.20.0, class: ContextedException / ContextedRuntimeException / ExceptionUtils, verified: "2026-05-09" }
    notes:
      - "Both callers must resolve through the same helper. Two same-shaped private helpers only move the clone."
      - "Prefer existing project abstractions and preserve caller contracts."
      - "For targets in different packages, put the helper in an actually shared package, add explicit imports or qualified references in both callers, and compile before further edits. Do not remove the helper while references remain."
      - "For duplicated state predicates across unrelated hierarchies, use one shared query such as ViewState.isEnabled(view), and keep each existing override as a one-line setEnabled(sharedQuery(getView())) delegate. Short delegating wrappers are an accepted shared implementation."
      - "Preserve every original side effect in the helper, including logger.warn/error calls, interrupt handling, metrics, and state-write order. Pass the existing logger or a narrow callback when the shared catch path owns logging."
      - "Use the narrowest visibility that reaches both callers. Same-package helpers should be package-private; cross-package helpers may be public when no existing owner works. Utility classes should be final with a private constructor and no unused imports."
