# IDEA refactor path examples.
# Smell: mysterious_name
# Loaded on demand by idea-refactor-cli; do not load unrelated smell files.
# Entry ids:
# - rename-single-char-param
# - rename-generic-method-name
# - rename-mysterious-local-variable
# - rename-mysterious-class-name

mysterious_name:
  - id: rename-single-char-param
    when: "a method parameter name is too short to carry meaning and must be renamed through the method signature so every caller updates together"
    before: |
      37    private static StringBuilder twoDigits(final StringBuilder sb, final int n) {
      38        return sb.append((char) ('0' + n / 10)).append((char) ('0' + n % 10));
      39    }
    actions:
      - op: change-signature:method
        apply_args: '{"parameters":[{"originalIndex":0,"name":"sb","type":"StringBuilder"},{"originalIndex":1,"name":"digitValue","type":"int"}]}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/lang3/time/GmtTimeZone.java", line=37, column=35)
          - idea_refactor_prepare(operation="change-signature:method", expectedOperation="change-signature:method")
          - idea_refactor_apply(arguments={"parameters":[{"originalIndex":0,"name":"sb","type":"StringBuilder"},{"originalIndex":1,"name":"digitValue","type":"int"}]})
    after: |
      37    private static StringBuilder twoDigits(final StringBuilder sb, final int digitValue) {
      38        return sb.append((char) ('0' + digitValue / 10)).append((char) ('0' + digitValue % 10));
      39    }
      // All call sites inside GmtTimeZone updated automatically (private method, 2 internal callers)
    source: { project: commons-lang-3.20.0, class: GmtTimeZone, verified: "2026-05-10" }
  - id: rename-generic-method-name
    when: "the method body has one clear intent, but the current method name is a generic verb that hides that intent"
    before: |
      30                        trim(src.attr("alt"), 20));
      42            print(" * a: <%s>  (%s)", link.attr("abs:href"), trim(link.text(), 35));
      50    private static String trim(String s, int width) {
      51        if (s.length() > width)
      52            return s.substring(0, width-1) + ".";
      53        else
      54            return s;
      55    }
    actions:
      - op: rename:method
        apply_args: '{"newName":"ellipsize"}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/jsoup/examples/ListLinks.java", line=50, column=27)
          - idea_refactor_prepare(operation="rename:method", expectedOperation="rename:method")
          - idea_refactor_apply(arguments={"newName":"ellipsize"})
    after: |
      30                        ellipsize(src.attr("alt"), 20));
      42            print(" * a: <%s>  (%s)", link.attr("abs:href"), ellipsize(link.text(), 35));
      50    private static String ellipsize(String s, int width) {
      51        if (s.length() > width)
      52            return s.substring(0, width-1) + ".";
      53        else
      54            return s;
      55    }
    source: { project: jsoup-1.18.1, class: ListLinks, verified: "2026-05-09" }
  - id: rename-mysterious-local-variable
    when: "a local temporary name is vague, but the variable plays one concrete role inside a small scope, so an in-place local rename is enough"
    before: |
      6545        int i = Math.max(startIndexInclusive, 0);
      6546        int j = Math.min(array.length, endIndexExclusive) - 1;
      6547        boolean tmp;
      6548        while (j > i) {
      6549            tmp = array[j];
      6550            array[j] = array[i];
      6551            array[i] = tmp;
      6552            j--;
    actions:
      - op: rename:local-variable
        apply_args: '{"newName":"rightValue"}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/lang3/ArrayUtils.java", line=6547, column=17)
          - idea_refactor_prepare(operation="rename:local-variable", expectedOperation="rename:local-variable")
          - idea_refactor_apply(arguments={"newName":"rightValue"})
        idea_ui_steps:
          - In ArrayUtils.java, place the caret on `tmp` inside `reverse(final boolean[] array, final int startIndexInclusive, final int endIndexExclusive)`.
          - Press `Shift+F6`, type `rightValue`, and confirm the in-place rename.
    after: |
      6545        int i = Math.max(startIndexInclusive, 0);
      6546        int j = Math.min(array.length, endIndexExclusive) - 1;
      6547        boolean rightValue;
      6548        while (j > i) {
      6549            rightValue = array[j];
      6550            array[j] = array[i];
      6551            array[i] = rightValue;
      6552            j--;
      // All three local references updated together within the method body.
    source: { project: commons-lang-3.20.0, class: ArrayUtils, verified: "2026-05-15", mode: "IDEA CLI" }
    notes: "Use locate on the local variable identifier, then prepare/apply rename:local-variable. The installed CLI path was verified on Java local-variable smoke cases."
  - id: rename-mysterious-class-name
    when: "a type name is an opaque abbreviation at module scope, so the right fix is a class rename rather than only renaming one member"
    before: |
      36    public abstract class Diff<T> extends Pair<T, T> {
      37
      38        private static final long serialVersionUID = 1L;
      39
      40        /** The field type. */
      41        private final Type type;
      42
      43        /** The field name. */
      44        private final String fieldName;
    actions:
      - op: rename:type
        apply_args: '{"newName":"FieldDifference"}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/lang3/builder/Diff.java", line=36, column=23)
          - idea_refactor_prepare(operation="rename:type", expectedOperation="rename:type")
          - idea_refactor_apply(arguments={"newName":"FieldDifference"})
    after: |
      36    public abstract class FieldDifference<T> extends Pair<T, T> {
      37
      38        private static final long serialVersionUID = 1L;
      39
      40        /** The field type. */
      41        private final Type type;
      42
      43        /** The field name. */
      44        private final String fieldName;
      // All references to Diff updated across the module (DiffBuilder, DiffResult, etc.)
    source: { project: commons-lang-3.20.0, class: Diff, verified: "2026-05-10" }
