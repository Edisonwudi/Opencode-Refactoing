      // only configurable executors support installing another wrapper.
      44    final class DelegatingExecutor implements RuntimeExecutor {
      45        @Override
      46        public void setWrapper(RuntimeExecutor wrapper) {
      47            throw new UnsupportedOperationException();
      48        }
      49    }
    actions:
