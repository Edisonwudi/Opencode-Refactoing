# IDEA refactor path examples.
# Smell: refused_bequest
# Loaded on demand by idea-refactor-cli; do not load unrelated smell files.
# Entry ids:
# - remove-redundant-override
# - implement-required-contract-method
# - delegate-required-override-to-existing-overload
# - delegate-required-override-to-existing-helper
# - complete-required-contract-from-sibling-pattern
# - split_collection_wrapper_from_property_wrapper
# - replace_closed_executor_inheritance_with_closed_executor_guard
# - split_executor_wrapping_capability_from_executor_runtime_operations
# - return_existing_multiple_values_state
# - split_inbound_packet_from_outbound_packet_contract
# - replace_MessageFormat_inheritance_with_composed_extended_formatter
# - push-down-misowned-hierarchy-hook

refused_bequest:
  - id: remove-redundant-override
    when: "the reported override adds no real subclass behavior, so the right fix is to remove the override entirely rather than keep an empty hook or pure delegation layer"
    before: |
      // Verified variant: pure super-delegation override.
      // StandardToStringStyle extends ToStringStyle (concrete parent with real implementation)
      54    @Override
      55    public String getArrayEnd() {
      56        return super.getArrayEnd();
      57    }
      // The same route also covers delete-legal empty overrides that add no subclass-specific behavior.
    actions:
      - op: inline:method
        apply_args: '{"keepMethodDeclaration":false}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/lang3/builder/StandardToStringStyle.java", line=55, column=20)
          - idea_refactor_prepare(operation="inline:method", expectedOperation="inline:method")
          - idea_refactor_apply(arguments={"keepMethodDeclaration":false})
    after: |
      // StandardToStringStyle.getArrayEnd() removed entirely.
      // Callers now invoke ToStringStyle.getArrayEnd() directly via inheritance.
    source: { project: commons-lang-3.20.0, class: StandardToStringStyle, verified: "2026-05-10", mode: "OpenCode IDEA tools" }
    notes:
      - "Use this route when deleting the override preserves the parent contract. If the method is still required by an interface or abstract parent, use `implement-required-contract-method` instead."
      - "Keep the change on the selected method. Do not widen to a whole-class patch."
      - "For pure super-delegation overrides, the verified CLI path is `inline:method` with `keepMethodDeclaration=false`."
  - id: implement-required-contract-method
    when: "the reported method is an empty override required by an interface or abstract parent, and no same-class overload, existing helper, or sibling protocol pattern can implement it more specifically"
    before: |
      // Synthetic fallback variant: the override is required by the parent contract,
      // and the implementation is a small local normalization rather than delegation
      // to an existing overload/helper or a sibling request/transport protocol.
      31    @Override
      32    public boolean accepts(Record record) {
      33
      34    }
    actions:
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/filter/EnabledRecordFilter.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/filter/EnabledRecordFilter.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // The required override remains present and now satisfies the parent contract
      // with a narrow local implementation.
      31    @Override
      32    public boolean accepts(Record record) {
      33        return record != null && record.isEnabled();
      34    }
    source: { project: synthetic-refactor-paths, class: EnabledRecordFilter, verified: "synthetic" }
    notes:
      - "Use this fallback only after ruling out `delegate-required-override-to-existing-overload`, `delegate-required-override-to-existing-helper`, and `complete-required-contract-from-sibling-pattern`."
      - "Derive the replacement body from the parent contract and nearby domain invariants; do not invent unrelated behavior."
      - "Keep the change to one selected method. Do not use a whole-class patch for empty-overrides evidence."
  - id: delegate-required-override-to-existing-overload
    when: "the reported empty override is required by a parent contract, and another overload in the same class already implements the same operation with a richer or normalized argument shape"
    before: |
      // Synthetic variant: the required one-argument override is empty, but the same
      // class already has a two-argument overload that performs the real operation.
      40    @Override
      41    public void publish(File target) throws ServiceException {
      42
      43    }
      45    public void publish(File target, PublishOptions options) throws ServiceException {
      46        PublishRequest request = new PublishRequest(target, options);
      47        dispatcher.dispatch(request);
      48    }
    actions:
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/remote/RemotePublisher.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/remote/RemotePublisher.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // The required override remains present but no longer refuses the bequest.
      40    @Override
      41    public void publish(File target) throws ServiceException {
      42        publish(target, PublishOptions.defaults());
      43    }
    source: { project: synthetic-refactor-paths, class: RemotePublisher, verified: "synthetic" }
    notes:
      - "Use this path when source inspection proves a same-class overload already owns the behavior."
      - "Preserve the required override signature; do not delete it or broaden public API."
      - "Choose defaults from existing constants, helper methods, or documented overload behavior rather than inventing new semantics."
  - id: delegate-required-override-to-existing-helper
    when: "the reported empty override is required by a parent contract, and a dedicated service/helper already owns the operation so the override should delegate to that helper"
    before: |
      // Synthetic variant: MetadataController must implement loadMetadata(), but the
      // logic already belongs to MetadataLoaderService.
      22    class MetadataController implements MetadataLoader {
      23        @Override
      24        public Metadata loadMetadata(Path source) throws IOException {
      25
      26        }
      27    }

      10    class MetadataLoaderService {
      11        Metadata loadMetadata(Path source) throws IOException { ... }
      12    }
    actions:
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/metadata/MetadataController.java, choose a unique surrounding oldString at the insertion point, and call idea_edit with newString equal to that old block plus the inserted Java source; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/metadata/MetadataController.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/metadata/MetadataController.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/metadata/MetadataController.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // The required override delegates to the existing semantic owner.
      22    class MetadataController implements MetadataLoader {
      23        private final MetadataLoaderService metadataLoaderService;
      24
      25        @Override
      26        public Metadata loadMetadata(Path source) throws IOException {
      27            return metadataLoaderService.loadMetadata(source);
      28        }
      29    }
    source: { project: synthetic-refactor-paths, class: MetadataController / MetadataLoaderService, verified: "synthetic" }
    notes:
      - "Use this path when there is already a clear helper/service/domain owner; do not create another helper."
      - "Constructor injection, framework wiring, or test fixtures may need a narrow follow-up direct edit after the Java source patch."
      - "If the dependency already exists as a field, skip adding a field and only patch the empty method body."
  - id: complete-required-contract-from-sibling-pattern
    when: "the reported empty override is required by a parent contract, and sibling methods or implementations show the request/transport/handler pattern needed to complete it"
    before: |
      // Synthetic variant: removeUser is empty, but createUser and updateUser show
      // the required request + transport + handler sequence.
      70    @Override
      71    public void removeUser(String userId) throws RemoteException {
      72
      73    }
      75    @Override
      76    public void createUser(String userId, UserOptions options) throws RemoteException {
      77        RemoteRequest request = new CreateUserRequest(userId, options);
      78        request.setTransport(transport);
      79        handler.handle(request, session);
      80    }
    actions:
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/remote/RemoteUserAdmin.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/remote/RemoteUserAdmin.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // The required override follows the sibling request/transport/handler pattern.
      70    @Override
      71    public void removeUser(String userId) throws RemoteException {
      72        RemoteRequest request = new RemoveUserRequest(userId);
      73        request.setTransport(transport);
      74        handler.handle(request, session);
      75    }
    source: { project: synthetic-refactor-paths, class: RemoteUserAdmin, verified: "synthetic" }
    notes:
      - "Use this path when no overload/helper should be delegated to, but adjacent contract implementations reveal the exact implementation protocol."
      - "Keep the replacement narrow and protocol-shaped; when protocol support is incomplete, prefer the smallest coherent implementation plan and mark the missing infrastructure as a risk instead of stopping early."
  - id: split_collection_wrapper_from_property_wrapper
    when: "a collection-oriented wrapper inherits bean/property accessor operations that it cannot support, but the project design can separate collection operations from property-wrapper operations"
    before: |
      // Synthetic variant: ListWrapper implements a broad ObjectAccess contract.
      // Collection append operations are valid, while property navigation methods
      // throw UnsupportedOperationException because they belong to a bean wrapper.
      18    class ListWrapper implements ObjectAccess {
      19        @Override
      20        public Object get(PropertyPath path) {
      21            throw new UnsupportedOperationException();
      22        }
      24        public void add(Object value) {
      25            list.add(value);
      26        }
      27    }
    actions:
      - op: idea_edit
        argument_contract: "Use idea_edit with file=src/main/java/com/example/wrapper/CollectionAccess.java, oldString=\"\", newString=<complete new Java source>, replaceAll=false. This creates the new file; do not insert a full compilation unit into an existing Java file."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/wrapper/CollectionAccess.java", oldString="", newString=<complete new Java source>, replaceAll=false)
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/wrapper/ListWrapper.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/wrapper/ListWrapper.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // The collection wrapper no longer inherits unsupported property accessors.
      // Property-capable wrappers keep the broad property contract; collection
      // wrappers expose only collection operations.
    source: { project: synthetic-refactor-paths, class: ListWrapper / ObjectAccess, verified: "synthetic" }
    notes:
      - "Use this path for relaxed refused-bequest rows where the unsupported override is caused by a wide property-wrapper interface."
      - "Plan the interface split as an executable multi-file change; mark API/caller migration risk in risk_tags instead of blocking only because the path is broad."
      - "If call sites still require the broad type, migrate them to the new narrower collection contract or an adapter in the same change."
  - id: replace_closed_executor_inheritance_with_closed_executor_guard
    when: "a closed or sentinel executor subclass inherits runtime executor operations only to reject them, and a narrower closed-state guard or sentinel object can express the behavior"
    before: |
      // Synthetic variant: ClosedJobRunner extends JobRunner but every runtime
      // operation refuses execution because the object is a closed sentinel.
      31    final class ClosedJobRunner extends JobRunner {
      32        @Override
      33        protected Result run(Task task) {
      34            throw new UnsupportedOperationException();
      35        }
      36    }
    actions:
      - op: idea_edit
        argument_contract: "Use idea_edit with file=src/main/java/com/example/runner/ClosedRunnerState.java, oldString=\"\", newString=<complete new Java source>, replaceAll=false. This creates the new file; do not insert a full compilation unit into an existing Java file."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/runner/ClosedRunnerState.java", oldString="", newString=<complete new Java source>, replaceAll=false)
      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/runner/ClosedJobRunner.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/runner/ClosedJobRunner.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // The closed sentinel no longer inherits executable runtime operations.
      // Callers check the closed-state contract or receive the existing closed
      // guard failure before invoking runtime operations.
    source: { project: synthetic-refactor-paths, class: ClosedJobRunner, verified: "synthetic" }
    notes:
      - "Use this path when the subclass represents a closed/sentinel state rather than an executable specialization."
      - "Migrate callers that only need closed-state checks to the narrow guard/interface."
      - "Preserve existing closed-state exception semantics; do not make the sentinel executable."
  - id: split_executor_wrapping_capability_from_executor_runtime_operations
    when: "an executor exposes a wrapper setup method that is not meaningful for one implementation, and wrapping should be modeled as a separate setup capability"
    before: |
