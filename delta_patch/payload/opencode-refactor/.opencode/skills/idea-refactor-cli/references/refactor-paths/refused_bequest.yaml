  - id: push-down-misowned-hierarchy-hook
    when: "the behavior is real but a concrete parent hook is only meaningful for one subclass, so ownership should move downward instead of leaving the hook on the parent"
    before: |
      // RecursiveToStringStyle (parent) — defines accept() as a hook that always returns true
      77        protected boolean accept(final Class<?> clazz) {
      78            return true;
      79        }
      // MultilineRecursiveToStringStyle (only subclass) — does NOT override accept()
    actions:
      - op: pushDown:method
        apply_args: '{"makeAbstract":null,"targetSubclasses":[]}'
        cli_steps:
          - idea_refactor_locate(file="src/main/java/org/apache/commons/lang3/builder/RecursiveToStringStyle.java", line=77, column=21)
          - idea_refactor_prepare(operation="pushDown:method", expectedOperation="pushDown:method")
          - idea_refactor_apply(arguments={"makeAbstract":null,"targetSubclasses":[]})
    after: |
      // RecursiveToStringStyle — accept() removed from parent
      53    public class RecursiveToStringStyle extends ToStringStyle {
      // ... no accept() ...
      // MultilineRecursiveToStringStyle — accept() moved here
      65    public class MultilineRecursiveToStringStyle extends RecursiveToStringStyle {
      ...
          @Override
          protected boolean accept(final Class<?> clazz) {
              return true;
          }
    source: { project: commons-lang-3.20.0, class: "RecursiveToStringStyle -> MultilineRecursiveToStringStyle", verified: "2026-05-10", mode: "OpenCode IDEA tools" }
    notes:
      - "Choose `pushDown:method` when a concrete parent hook is only meaningful for one subclass."
      - "This is the native push-down route. Prefer it only after ruling out `remove-redundant-override` and `implement-required-contract-method`."
