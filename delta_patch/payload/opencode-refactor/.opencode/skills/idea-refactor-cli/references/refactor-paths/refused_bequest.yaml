        argument_contract: "Use idea_edit with file=src/main/java/com/example/packet/OutboundPacket.java, oldString=\"\", newString=<complete new Java source>, replaceAll=false. This creates the new file; do not insert a full compilation unit into an existing Java file."
        cli_steps:
