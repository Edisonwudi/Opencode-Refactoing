      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/packet/ClientHandshakePacket.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/packet/ClientHandshakePacket.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // Outbound packets no longer inherit inbound parsing methods.
      // Inbound packet implementations keep fromBytes on the inbound contract.
    source: { project: synthetic-refactor-paths, class: ClientHandshakePacket, verified: "synthetic" }
    notes:
      - "Use this path for directional protocol classes where unsupported parsing is a contract-splitting smell."
      - "Migrate generic packet references to inbound or outbound contracts according to call-site usage."
