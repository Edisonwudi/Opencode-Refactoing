      - op: idea_edit
        argument_contract: "Read src/main/java/com/example/executor/DelegatingExecutor.java, choose the exact unique oldString for the declaration/block being replaced, and call idea_edit with the replacement Java source as newString; replaceAll=false."
        cli_steps:
          - idea_edit(file="src/main/java/com/example/executor/DelegatingExecutor.java", oldString=<unique exact old source block>, newString=<replacement source block>, replaceAll=false)
    after: |
      // Wrapper setup is a separate capability. Runtime-only executor contracts
      // no longer require implementations to expose an unsupported setter.
    source: { project: synthetic-refactor-paths, class: DelegatingExecutor, verified: "synthetic" }
    notes:
      - "Use this path when the refused method is a setup/configuration capability rather than core executor runtime behavior."
      - "Move or rename call sites to the capability type instead of keeping an unsupported override on the runtime executor."
